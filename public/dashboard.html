<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Companion</title>

  <style>
    :root {
      --cream: #FAF0E6;
      --purple: #8b45ff;
      --lavender: #cdaed2;
      --gold: #cc9824;
      --orange: #f34b16;
      --blue: #d3e8f8;
      --pale-yellow: #f2e2b8;
      --ink: #3e3b3c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 6px;
      background: var(--cream);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
      min-height: calc(100vh - 12px);
      border: 2px solid var(--purple);
      padding: clamp(20px, 5vw, 44px);
      display: grid;
      grid-template-columns: 1.05fr 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 16px;
    }

    .brand {
      grid-column: 1;
      grid-row: 1;
      align-self: center;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      font-family: Arial, sans-serif;
      font-size: clamp(20px, 2.2vw, 28px);
      letter-spacing: 0.3em;
      white-space: nowrap;
    }

    .brand-mark {
      width: 22px;
      height: 32px;
      background: var(--lavender);
      border-radius: 80% 0 80% 10%;
      transform: rotate(-24deg);
      flex-shrink: 0;
    }

    .tile {
      position: relative;
      min-height: 200px;
      border-radius: 14px;
      padding: 24px 16px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      text-decoration: none;
      color: #fff8e9;
      overflow: hidden;
      transition: transform 220ms ease, box-shadow 220ms ease;
      isolation: isolate;
    }

    .tile:hover,
    .tile:focus-visible {
      transform: translateY(-5px);
      box-shadow: 0 12px 24px rgba(69, 46, 85, 0.15);
      outline: none;
    }

    .tile:focus-visible {
      outline: 3px solid var(--purple);
      outline-offset: 4px;
    }

    .tile.lavender { background: var(--lavender); }
    .tile.gold { background: var(--gold); }
    .tile.orange { background: var(--orange); }
    .tile.blue { background: var(--blue); color: #c58c16; }
    .tile.yellow { background: var(--pale-yellow); color: var(--orange); }

    .tile-icon {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      color: inherit;
    }

    .tile-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .tile h2 {
      margin: 16px 0 0;
      font-size: clamp(23px, 2.5vw, 32px);
      line-height: 0.98;
      font-weight: 900;
      letter-spacing: -0.04em;
      text-shadow: 1px 1px 0 rgba(255,255,255,0.45);
    }

    .plus {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--cream);
      color: var(--purple);
      font: 20px/20px Arial, sans-serif;
      font-weight: 300;
      display: grid;
      place-items: center;
    }

    .tile-team {
      grid-column: 1;
      grid-row: 2;
      min-height: 320px;
    }

    .tile-handbook { grid-column: 2; grid-row: 1; }
    .tile-projects { grid-column: 3; grid-row: 1; }
    .tile-hiring { grid-column: 4; grid-row: 1; }
    .tile-events { grid-column: 2; grid-row: 2; }
    .tile-services { grid-column: 3; grid-row: 2; }
    .tile-culture { grid-column: 4; grid-row: 2; }

    .team-art {
      width: 100%;
      max-width: 190px;
      height: 190px;
      position: relative;
      margin-top: 10px;
    }

    .team-art .book {
      position: absolute;
      width: 112px;
      height: 76px;
      left: 35px;
      top: 65px;
      background: #fff8e9;
      border: 2px solid #b7b0a4;
      border-radius: 5px;
      transform: rotate(-13deg);
      box-shadow: 8px 10px 0 #373334;
    }

    .team-art .book::before,
    .team-art .book::after {
      content: "";
      position: absolute;
      top: 12px;
      bottom: 12px;
      width: 1px;
      background: #c8c0b3;
    }

    .team-art .book::before { left: 50%; }
    .team-art .book::after {
      left: 12px;
      right: 12px;
      top: 26px;
      bottom: auto;
      width: auto;
      height: 1px;
      box-shadow: 0 10px 0 #c8c0b3, 0 20px 0 #c8c0b3;
    }

    .team-art .cup {
      position: absolute;
      right: 16px;
      top: 62px;
      width: 36px;
      height: 56px;
      background: #3e3b3c;
      border: 4px solid #fff8e9;
      border-radius: 8px 8px 14px 14px;
      transform: rotate(8deg);
    }

    .team-art .cup::before {
      content: "";
      position: absolute;
      right: -15px;
      top: 9px;
      width: 14px;
      height: 22px;
      border: 4px solid #fff8e9;
      border-left: 0;
      border-radius: 0 12px 12px 0;
    }

    .team-art .plant {
      position: absolute;
      left: 68px;
      top: 14px;
      width: 44px;
      height: 66px;
      background: #c8bca9;
      border-radius: 50% 50% 8px 8px;
      transform: rotate(-10deg);
    }

    .team-art .plant::before,
    .team-art .plant::after {
      content: "";
      position: absolute;
      width: 25px;
      height: 45px;
      background: #d8cbb8;
      border-radius: 80% 0 80% 0;
      top: 13px;
    }

    .team-art .plant::before {
      left: -18px;
      transform: rotate(-35deg);
    }

    .team-art .plant::after {
      right: -17px;
      transform: rotate(55deg);
    }

    .team-art .spark {
      position: absolute;
      width: 12px;
      height: 12px;
      background: var(--orange);
      border-radius: 50% 0 50% 50%;
      transform: rotate(35deg);
    }

    .team-art .s1 { left: 18px; bottom: 35px; }
    .team-art .s2 { left: 42px; bottom: 18px; }
    .team-art .s3 { left: 68px; bottom: 29px; }
    .team-art .s4 { left: 93px; bottom: 12px; }

    .detail-panel {
      display: none;
      grid-column: 2 / 5;
      grid-row: 1 / 3;
      align-self: center;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid #d8c5e8;
      border-radius: 18px;
      padding: 28px;
      animation: appear 250ms ease both;
    }

    .detail-panel.active {
      display: block;
    }

    .detail-panel h2 {
      font-size: clamp(28px, 4vw, 42px);
      margin: 0 0 12px;
      color: var(--purple);
    }

    .detail-panel p {
      font: 16px/1.6 Arial, sans-serif;
      max-width: 600px;
    }

    .back-button {
      border: 0;
      background: var(--purple);
      color: white;
      border-radius: 999px;
      padding: 12px 20px;
      font: 600 14px Arial, sans-serif;
      cursor: pointer;
      margin-top: 12px;
    }

    .back-button:hover {
      background: #7131dc;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 850px) {
      .page {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: auto;
      }

      .brand {
        grid-column: 1 / -1;
        grid-row: auto;
        justify-self: center;
        margin-bottom: 8px;
      }

      .tile,
      .tile-team,
      .tile-handbook,
      .tile-projects,
      .tile-hiring,
      .tile-events,
      .tile-services,
      .tile-culture {
        grid-column: auto;
        grid-row: auto;
        min-height: 240px;
      }

      .tile-team {
        grid-row: span 2;
      }

      .detail-panel {
        grid-column: 1 / -1;
        grid-row: auto;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 18px;
        gap: 12px;
      }

      .tile,
      .tile-team {
        min-height: 205px;
        padding: 20px 10px;
      }

      .tile-icon {
        width: 58px;
        height: 58px;
      }

      .tile h2 {
        font-size: 23px;
      }

      .team-art {
        transform: scale(0.82);
        margin: -4px 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="page" id="home">
    <div class="brand" aria-label="Campus Companion">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>KYA</br>SCENE</span>
    </div>

    <a class="tile lavender tile-handbook" href="create.html" data-title="Crete Announcement"

      <span class="plus" aria-hidden="true">+</span>

      <span class="tile-icon" aria-hidden="true">
        <svg viewBox="0 0 100 100">

    <a class="tile yellow tile-culture" href="profile.html" data-title="Profile"

      <span class="plus" aria-hidden="true">+</span>
      <span class="tile-icon" aria-hidden="true">
        <svg viewBox="0 0 100 100">
          <path d="M12 86 15 47 35 20 62 12 85 20 94 45 94 86 77 86 80 49 73 30 59 25 41 31 28 50 28 86Z"/>
        </svg>

      <h2>Profile</h2>

    <section class="detail-panel" id="detailPanel" aria-live="polite">
      <h2 id="detailTitle">Welcome to Campus Companion</h2>
      <p id="detailDescription">Choose a tile to explore a section of your campus.</p>
     
  </main>
</body>
</html>
